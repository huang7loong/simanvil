name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install OSMesa headless OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6-dev libgl1 libglx-mesa0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install simanvil (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify CLI & package imports
        run: |
          simanvil --help
          python -c "import simanvil; assert hasattr(simanvil, 'render_contact_mechanics_reel')"

      - name: Run pytest (headless OSMesa)
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: pytest -v
